apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: pricing, namespace: derivatives }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pricing }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: portfolio, namespace: derivatives }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: portfolio }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
