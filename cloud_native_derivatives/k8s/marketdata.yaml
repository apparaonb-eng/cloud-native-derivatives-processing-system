apiVersion: apps/v1
kind: Deployment
metadata: { name: marketdata, namespace: derivatives, labels: { app: marketdata } }
spec:
  replicas: 1
  selector: { matchLabels: { app: marketdata } }
  template:
    metadata:
      labels: { app: marketdata }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8002", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: marketdata
          image: derivatives-marketdata:latest      # push to your registry and change this
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8002 }]
          envFrom: [{ configMapRef: { name: platform-config } }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8002 }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: 8002 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: marketdata, namespace: derivatives }
spec:
  selector: { app: marketdata }
  ports: [{ port: 8002, targetPort: 8002 }]
